[workspace]
resolver = "2"
members = [
    "crates/vela-core",
    "crates/vela-cache",
    "crates/vela-jmap",
    "crates/vela-flows",
    "apps/cosmic",
    "apps/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
ammonia = "4"
dirs = "6"
jiff = { version = "0.2", features = ["serde"] }
jmap-client = { version = "0.3", default-features = false, features = ["async", "websockets"] }
oo7 = { version = "0.4", default-features = false, features = ["tokio", "native_crypto"] }
# Enable OS trust store roots in reqwest so private CAs (e.g. ca.example.com)
# work with full TLS verification inside jmap-client.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }

# Pin libcosmic to a reproducible commit on master.
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "009fb9d4138f25615122c4ccc42d025472da9cdd", features = [
    "multi-window",
    "single-instance",
    "wgpu",
    "xdg-portal",
] }

vela-core = { path = "crates/vela-core" }
vela-cache = { path = "crates/vela-cache" }
vela-jmap = { path = "crates/vela-jmap" }
vela-flows = { path = "crates/vela-flows" }

[profile.release]
lto = "thin"
strip = true
