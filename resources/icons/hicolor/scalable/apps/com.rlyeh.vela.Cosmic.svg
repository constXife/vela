<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2833"/>
      <stop offset="100%" stop-color="#11161c"/>
    </linearGradient>
    <linearGradient id="sailMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7be8f6"/>
      <stop offset="100%" stop-color="#2bb8d6"/>
    </linearGradient>
    <linearGradient id="sailWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38c6e0"/>
      <stop offset="100%" stop-color="#1b7f9e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- COSMIC squircle base -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="9" y="9" width="110" height="110" rx="25" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Subtle horizon arc -->
  <path d="M 28 96 Q 64 104 100 96" fill="none" stroke="#4fd1e8" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round"/>

  <!-- Secondary sail / envelope fold -->
  <path d="M 32 88 L 62 32 L 58 88 Z" fill="url(#sailWing)" opacity="0.92"/>

  <!-- Primary sail / paper-plane wing -->
  <path d="M 62 26 L 98 88 L 62 80 Z" fill="url(#sailMain)"/>

  <!-- Envelope crease highlight -->
  <path d="M 32 88 L 62 80 L 98 88" fill="none" stroke="#c8f7ff" stroke-opacity="0.65" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
